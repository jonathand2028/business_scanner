name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q

      - name: Evaluate detection quality
        run: python eval/run_eval.py --min-f1 0.80

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension matches the Python detector
        run: node extension/test/run_tests.js
